openapi: 3.1.0
info:
  title: Vocabulary Learning API
  version: 0.1.0
  description: >
    App-only REST API for the vocabulary learning app (React Native client,
    Spring Boot server). No public API. Grading is client-side: exercises ship
    with their correct answer and the client submits results for tracking.
    User identity is always derived from the bearer token subject, never from
    the path or body.

servers:
  # The /v1 prefix is the Spring `server.servlet.context-path: /v1`.
  # It lives in the server URL, NOT on each path — effective URL = server.url + path
  # (e.g. http://localhost:8080/v1 + /auth/login = http://localhost:8080/v1/auth/login).
  # Do not repeat /v1 on individual paths or it will double.
  - url: https://api.example.com/v1
    description: Production (context-path /v1)
  - url: http://localhost:8080/v1
    description: Local (context-path /v1)

security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Account
  - name: Public
  - name: Catalog
  - name: Enrollment
  - name: Session
  - name: Progress

paths:
  # ----------------------------- AUTH -----------------------------
  /auth/register:
    post:
      tags: [Auth]
      summary: Create account
      security: []
      description: >
        Creates the account row (password is accepted but not stored or
        verified - auth stays stubbed) and sends a 4-digit
        registration-confirmation code by email, asynchronously. Returns
        tokens immediately - access is NOT gated on confirming the code (MVP;
        see doc/CLAUDE.md, auth stays stubbed).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '409':
          description: Email already registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { error: { status: 409, code: EMAIL_TAKEN, message: "An account with this email already exists", traceId: req_a3f2c9 } }
        '400': { $ref: '#/components/responses/Error' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Email + password to tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Error' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh token to new access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: New tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Error' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Invalidate refresh token
      responses:
        '204': { description: Logged out }

  /auth/reset/request:
    post:
      tags: [Auth]
      summary: Request a password reset code
      security: []
      description: >
        Always responds 204, regardless of whether the email matches an
        account - account existence must never be leaked. If it matches,
        generates a 4-digit code, stores it in a cache (TTL <= 1h, keyed by
        purpose + email), and emails it asynchronously.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetCodeRequest' }
      responses:
        '204': { description: Code sent if the account exists (response does not indicate which) }

  /auth/reset/confirm:
    post:
      tags: [Auth]
      summary: Confirm a password reset with a code or a link token
      security: []
      description: >
        Shared confirm step for BOTH reset flows - supply exactly one of
        `code` (from /auth/reset/request) or `token` (from /auth/reset/link).
        Verifies it (code: cache lookup, exists/unexpired/matches; token:
        signature + expiry, no storage) and invalidates the code if one was
        used. The new password is accepted but not stored or verified - auth
        stays stubbed. Wrong/expired/missing
        code-or-token all respond identically with INVALID_OR_EXPIRED_CODE -
        do not distinguish "not found" from "expired" in the response.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetConfirmRequest' }
      responses:
        '204': { description: Password updated }
        '400': { $ref: '#/components/responses/Error' }

  /auth/reset/link:
    post:
      tags: [Auth]
      summary: Request a code-less reset link
      security: []
      description: >
        Code-less alternative to /auth/reset/request. Emails a stateless
        SIGNED token (short-lived, e.g. JWS with expiry - no server-side
        storage) as a reset link, plus a separate fraud-signal notification
        email ("if this wasn't you..."). Same non-enumeration behavior as
        /auth/reset/request.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetLinkRequest' }
      responses:
        '204': { description: Link sent if the account exists (response does not indicate which) }

  # ---------------------------- PUBLIC -----------------------------
  # Unauthenticated, pre-login endpoints. Namespaced under /public so more
  # public/bootstrap resources can be added here later.
  /public/init:
    get:
      tags: [Public]
      summary: Public bootstrap data (pre-login)
      security: []
      description: >
        Generic bootstrap payload for screens that run before login (e.g. the
        init_account language-pair picker). Currently carries only
        languagePairs, but the response is an object - not a bare array - so
        more public data can be added here later without breaking clients.
        For the equivalent call from inside the logged-in app, see the
        secured GET /language-pairs.
      responses:
        '200':
          description: Public bootstrap data
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicInitResponse' }

  # ---------------------------- ACCOUNT -----------------------------
  /me:
    get:
      tags: [Account]
      summary: Current account
      responses:
        '200':
          description: Account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountView' }
    patch:
      tags: [Account]
      summary: Update current account (partial)
      description: >
        Updates name / uiLang / learnBaseLang / learnTargetLang. `email` is
        not editable here (identity); `status` is not user-editable (billing
        tier). (learnBaseLang, learnTargetLang) must be a pair returned by
        GET /language-pairs, or the request is rejected with
        `UNSUPPORTED_PAIR`. init_account (post-registration) calls this same
        endpoint to set name + the learning pair - there is no separate init
        endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountUpdate' }
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountView' }
        '400': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Account]
      summary: Delete current account
      description: >
        Deletes the account row. FK ON DELETE CASCADE removes the user's
        user_list / list_progress / sessions / attempt rows.
      responses:
        '204': { description: Account deleted }

  # ---------------------------- CATALOG ---------------------------
  /languages:
    get:
      tags: [Catalog]
      summary: Supported languages
      responses:
        '200':
          description: Languages
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Language' }

  /language-pairs:
    get:
      tags: [Catalog]
      summary: Supported (base, target) language pairs (in-app, authenticated)
      description: >
        Secured counterpart to GET /public/init's languagePairs, for use
        inside the logged-in app (catalog pair filter, and the validation
        source for PATCH /me's learnBaseLang/learnTargetLang check).
        Currently sourced from application.yml as a TEMPORARY stand-in for
        coverage-derived pairs - the real long-term constraint is translation
        coverage in the data. Do not assume this list is exhaustive of what
        the data could support.
      responses:
        '200':
          description: Supported language pairs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LanguagePair' }

  /lists:
    get:
      tags: [Catalog]
      summary: Curated lists for a language pair
      description: >
        Returns only (base, target) pairs that have translation coverage, so
        supported combos are emergent from data rather than a declared list.
      parameters:
        - name: target
          in: query
          required: true
          schema: { $ref: '#/components/schemas/LanguageCode' }
          example: sv
        - name: base
          in: query
          required: true
          schema: { $ref: '#/components/schemas/LanguageCode' }
          example: en
      responses:
        '200':
          description: Lists
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ListSummary' }

  /lists/{listId}:
    get:
      tags: [Catalog]
      summary: List detail
      parameters:
        - $ref: '#/components/parameters/ListId'
      responses:
        '200':
          description: List detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListDetail' }
        '404': { $ref: '#/components/responses/Error' }

  /lists/{listId}/items:
    get:
      tags: [Catalog]
      summary: Words in a list
      description: >
        Citation-form word + translation per lexeme in the list, ordered by curated
        position. Catalog data only - no per-user mastery state (cross-reference
        GET /enrollments/{listId}/progress, keyed by lexemeId, for that).
      parameters:
        - $ref: '#/components/parameters/ListId'
        - name: base
          in: query
          required: true
          schema: { $ref: '#/components/schemas/LanguageCode' }
          example: en
      responses:
        '200':
          description: Words
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ListWord' }
        '404': { $ref: '#/components/responses/Error' }

  /lists/{listId}/enroll:
    post:
      tags: [Enrollment]
      summary: Enroll current user in a list (idempotent) / restart a completed one
      description: >
        Creates one user_list row (a reference, not a copy of the words).
        Idempotent for the SAME active list - enrolling twice returns the
        existing enrollment (200). If that list is already 'completed', this
        instead REACTIVATES the same row (status -> active, completed_at ->
        null) with its list_progress left untouched - "restart" means
        resume/review with existing mastery intact, not a wipe. Either way,
        a user has at most ONE active enrollment (MVP): if a DIFFERENT list
        is currently active, enrolling/restarting here DELETES that active
        enrollment first (cascading to its list_progress/sessions) - this is
        destructive to THAT list's progress (completed lists are never
        touched by this rule, only whatever is currently active). The client
        is expected to warn the user before calling this in that situation.
        User id comes from the token, not the body.
      parameters:
        - $ref: '#/components/parameters/ListId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseLang]
              properties:
                baseLang:
                  allOf:
                    - $ref: '#/components/schemas/LanguageCode'
                  description: Language taught FROM for this enrollment.
                  example: en
      responses:
        '200':
          description: >
            Row already existed - covers two distinct cases, both a no-op on
            list_progress: the list was already 'active' (pure idempotent
            no-op), OR it was 'completed' and got reactivated (status flips to
            'active', progress untouched). Inspect the returned `status`/
            `wordsMastered` to tell them apart if it matters to the client.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Enrollment' }
        '201':
          description: New user_list row created (first-time enroll in this list)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Enrollment' }
        '404': { $ref: '#/components/responses/Error' }

  # -------------------------- ENROLLMENT --------------------------
  /enrollments:
    get:
      tags: [Enrollment]
      summary: Current user's enrollments with progress summary
      responses:
        '200':
          description: Enrollments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Enrollment' }

  /enrollments/{listId}:
    get:
      tags: [Enrollment]
      summary: One enrollment (sessions done/total, percent complete)
      parameters:
        - $ref: '#/components/parameters/ListId'
      responses:
        '200':
          description: Enrollment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Enrollment' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Enrollment]
      summary: Un-enroll
      parameters:
        - $ref: '#/components/parameters/ListId'
      responses:
        '204': { description: Un-enrolled }
        '404': { $ref: '#/components/responses/Error' }

  /enrollments/{listId}/progress:
    get:
      tags: [Progress]
      summary: Per-word progress for a list
      parameters:
        - $ref: '#/components/parameters/ListId'
      responses:
        '200':
          description: Progress rows
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WordProgress' }

  # ---------------------------- SESSION ---------------------------
  /enrollments/{listId}/sessions:
    post:
      tags: [Session]
      summary: Derive a session on demand
      description: >
        Computes the next session fresh from in-progress words (not-yet-mastered
        ones prioritized, already-mastered ones only filling leftover budget)
        plus never-started words, and returns an ordered `items` array mixing
        introduce cards (new words, just-in-time) and fully built exercises
        WITH their correct answers (client-side grading). Deliberately NOT
        time-gated - an in-progress word is eligible again immediately, call
        this as many times in a row as you want, same day; nothing here waits
        on a due date or cooldown. The order encodes spacing/interleaving; the
        client renders top to bottom. A session is created, not fetched -
        there is no GET.
      parameters:
        - $ref: '#/components/parameters/ListId'
      responses:
        '200':
          description: Session with ordered items (intro cards + exercises)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '404': { $ref: '#/components/responses/Error' }

  /sessions/{sessionId}/complete:
    post:
      tags: [Session]
      summary: Close the session and submit results
      description: >
        Carries the results array. Server writes, in one transaction:
        per result an attempt row + a list_progress upsert, then one
        sessions row. NOT idempotent - `sessionId` is consumed on first call;
        retrying the same `sessionId` gets 404, it does not replay the same
        result. Clients must not call this twice for one derived session.
        Afterward, auto-checks completion: if every word in the list has now
        reached the mastery threshold, the enrollment flips to
        status=completed (list_progress is left as-is). The response here
        does not surface that flag - the client discovers it via the next
        GET /enrollments/{listId} or GET /me/home.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResultsBatch' }
      responses:
        '200':
          description: Progress updated and session logged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompleteResponse' }
        '404': { $ref: '#/components/responses/Error' }

  /sessions/{sessionId}/answers:
    post:
      tags: [Session]
      summary: Optional incremental result sync during a long session
      description: >
        NOT IMPLEMENTED YET. Attempts reference a `sessions` row that doesn't
        exist until /complete, so there is nowhere to attach an attempt's
        session id for a mid-session sync. Always returns 501 with no body,
        regardless of session state.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResultsBatch' }
      responses:
        '501':
          description: Not implemented

  # ---------------------------- PROGRESS --------------------------
  /me/home:
    get:
      tags: [Progress]
      summary: Aggregate home load
      description: >
        Profile + enrollments + progress + resume pointer in one round trip.
        There is no half-finished session to restore; resume points at the
        last-active enrollment and the client generates the next session.
      responses:
        '200':
          description: Home dashboard
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HomeResponse' }

  /me/stats:
    get:
      tags: [Progress]
      summary: Overall stats
      responses:
        '200':
          description: Stats
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Stats' }

# =============================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ListId:
      name: listId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    # ---- auth ----
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    TokenPair:
      type: object
      required: [accessToken, refreshToken]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, description: Access token TTL in seconds }
    ResetCodeRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    ResetConfirmRequest:
      type: object
      required: [email, newPassword]
      description: >
        Supply exactly one of `code` (from /auth/reset/request) or `token`
        (from /auth/reset/link) - not both, not neither.
      properties:
        email: { type: string, format: email }
        code:
          type: string
          minLength: 4
          maxLength: 4
          nullable: true
          example: '1234'
          description: 4-digit numeric code from the reset-code email.
        token:
          type: string
          nullable: true
          description: Stateless signed token from the reset-link email.
        newPassword: { type: string, minLength: 8 }
    ResetLinkRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    # ---- account ----
    AccountStatus:
      type: string
      description: Billing tier. Not user-editable; no billing logic yet.
      enum: [free, paid]
    AccountView:
      type: object
      required: [id, email, status]
      description: GET /me response. Never carries password/security fields.
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, format: email }
        name: { type: string, nullable: true }
        uiLang:
          allOf: [ $ref: '#/components/schemas/LanguageCode' ]
          nullable: true
          description: App interface language. Defaults to 'en'.
        learnBaseLang:
          allOf: [ $ref: '#/components/schemas/LanguageCode' ]
          nullable: true
          description: >
            Default/filter pair - language taught FROM. Pre-fills
            user_list.baseLang at enroll time; NOT the per-enrollment source
            of truth (that's Enrollment.baseLang).
        learnTargetLang:
          allOf: [ $ref: '#/components/schemas/LanguageCode' ]
          nullable: true
          description: Default/filter pair - language being learned.
        status: { $ref: '#/components/schemas/AccountStatus' }
    AccountUpdate:
      type: object
      description: >
        PATCH /me body - partial update, all fields optional; omit a field to
        leave it unchanged. email and status are not settable here.
      properties:
        name: { type: string }
        uiLang: { $ref: '#/components/schemas/LanguageCode' }
        learnBaseLang: { $ref: '#/components/schemas/LanguageCode' }
        learnTargetLang: { $ref: '#/components/schemas/LanguageCode' }

    # ---- catalog ----
    LanguageCode:
      type: string
      description: Closed set of supported language codes (`LanguageCode` enum).
      enum: [sv, en, ru, uk]
    Language:
      type: object
      required: [code, name]
      properties:
        code: { $ref: '#/components/schemas/LanguageCode' }
        name: { type: string, example: Swedish }
    LanguagePair:
      type: object
      required: [base, target]
      description: >
        A supported (base, target) combination - sourced from application.yml
        as a TEMPORARY stand-in for coverage-derived pairs. See
        GET /language-pairs and GET /public/init.
      properties:
        base: { $ref: '#/components/schemas/Language' }
        target: { $ref: '#/components/schemas/Language' }
    PublicInitResponse:
      type: object
      description: >
        GET /public/init response - a generic, unauthenticated bootstrap
        payload. An object, not a bare array, so more public data can be
        added later without breaking clients.
      properties:
        languagePairs:
          type: array
          items: { $ref: '#/components/schemas/LanguagePair' }
    ListSummary:
      type: object
      required: [listId, name, targetLang, totalWords]
      properties:
        listId: { type: integer, format: int64 }
        name: { type: string, example: Swedish Basics }
        targetLang: { $ref: '#/components/schemas/LanguageCode' }
        totalWords: { type: integer, example: 2000 }
    ListDetail:
      allOf:
        - $ref: '#/components/schemas/ListSummary'
        - type: object
          properties:
            allowedExercises:
              type: array
              nullable: true
              description: Null = all types permitted.
              items: { $ref: '#/components/schemas/ExerciseType' }
    ListWord:
      type: object
      required: [lexemeId, word, pos]
      properties:
        lexemeId: { type: integer, format: int64 }
        word: { type: string, example: ett hus, description: Citation form, ready to render. }
        pos: { type: string, example: noun }
        gender: { type: string, nullable: true, example: ett }
        translation:
          type: string
          nullable: true
          example: house
          description: Null if no translation exists for the requested base language.

    # ---- enrollment / progress ----
    Enrollment:
      type: object
      required: [listId, name, baseLang, targetLang, status]
      properties:
        listId: { type: integer, format: int64 }
        name: { type: string }
        baseLang: { $ref: '#/components/schemas/LanguageCode' }
        targetLang: { $ref: '#/components/schemas/LanguageCode' }
        status:
          type: string
          enum: [active, completed]
          description: >
            'completed' is set automatically (server-computed, on
            POST /sessions/{sessionId}/complete) when wordsMastered reaches
            totalWords - not a client action. Re-enrolling via
            POST /lists/{listId}/enroll on a completed list reactivates it
            (back to 'active') without resetting wordsMastered/totalWords.
        wordsMastered: { type: integer, example: 1 }
        totalWords: { type: integer, example: 3 }
        exercisesCompleted:
          type: integer
          example: 6
          description: >
            Exercise-level progress toward "list learned" - sum of each
            word's practice count, capped per word at the server's mastery
            threshold (extra reps past mastery don't push this past
            exercisesNeeded). USE THIS (with exercisesNeeded), not
            wordsMastered/totalWords, for a progress bar: wordsMastered only
            increments once a word is FULLY mastered, so it moves in coarse
            jumps; exercisesCompleted moves with every exercise answered.
            Also do NOT use sessions.done/estimatedTotal for this - that pair
            tracks session cadence, not mastery, and can hit 100% long before
            the list is actually learned.
        exercisesNeeded:
          type: integer
          example: 9
          description: >
            totalWords × the server's mastery-threshold config. That
            threshold is NOT exposed as its own field and must not be
            hardcoded client-side (MVP default is 3, production may differ) -
            always compute the fraction as exercisesCompleted/exercisesNeeded,
            never assume the per-word target.
        sessions:
          type: object
          properties:
            done: { type: integer, example: 1 }
            estimatedTotal: { type: integer, example: 8 }
        lastActiveAt: { type: string, format: date-time }
    WordProgress:
      type: object
      required: [lexemeId, timesPracticed]
      properties:
        lexemeId: { type: integer, format: int64 }
        timesPracticed: { type: integer }
        correct: { type: integer }
        wrong: { type: integer }
        due:
          type: string
          format: date-time
          nullable: true
          description: >
            Informational only - NOT a lockout. This word is already eligible
            for practice again right now regardless of this timestamp; the
            app never blocks practice with a cooldown. A seam for a future
            real spaced-repetition display hint.

    # ---- exercise type enum ----
    ExerciseType:
      type: string
      enum: [en_ett, assemble, translate, base_form, produce_form, multi_select]

    # ---- session response ----
    SessionResponse:
      type: object
      required: [sessionId, listId, items]
      properties:
        sessionId: { type: string }
        listId: { type: integer, format: int64 }
        items:
          type: array
          description: >
            Ordered, heterogeneous sequence the client renders top to bottom.
            The ORDER encodes the pedagogy (just-in-time intro cards, spaced and
            interleaved exercises); the client does not reorder.
          items: { $ref: '#/components/schemas/SessionItem' }

    # ---- session item: introduce card OR exercise, discriminated by itemType ----
    SessionItem:
      description: >
        A thing to show the user. itemType 'introduce' = a no-action teaching card
        (render + Next, never graded/logged). itemType 'exercise' = a graded task.
        itemType (what the client renders) is distinct from exerciseType (what gets
        graded/logged); introduce is NOT an exerciseType.
      oneOf:
        - $ref: '#/components/schemas/IntroduceItem'
        - $ref: '#/components/schemas/ExerciseItem'
      discriminator:
        propertyName: itemType
        mapping:
          introduce: '#/components/schemas/IntroduceItem'
          exercise: '#/components/schemas/ExerciseItem'

    # ---- introduce card ----
    IntroduceItem:
      type: object
      required: [itemId, itemType, lexemeId, card]
      properties:
        itemId: { type: string }
        itemType: { type: string, enum: [introduce] }
        lexemeId: { type: integer, format: int64 }
        card: { $ref: '#/components/schemas/IntroduceCard' }
    IntroduceCard:
      type: object
      required: [word, lemma, pos, translation, forms]
      description: >
        Word (citation form, article/marker composed server-side), translation in
        the enrollment base language, and the full labelled paradigm. Assembled from
        lexeme + word_form + translation; no new storage.
      properties:
        word: { type: string, example: att gå, description: Citation form, ready to render. }
        lemma: { type: string, example: gå }
        pos: { type: string, example: verb }
        gender: { type: string, nullable: true, example: null, description: en/ett for Swedish nouns. }
        translation: { type: string, example: to go, to walk }
        forms:
          type: array
          description: Full paradigm in paradigm order; formType codes, not display labels.
          items:
            type: object
            required: [formType, form]
            properties:
              formType: { type: string, example: preteritum }
              form: { type: string, example: gick }

    # ---- exercise item: shared envelope + polymorphic payload ----
    Prompt:
      type: object
      required: [text, lang]
      properties:
        text: { type: string, example: hus }
        lang: { type: string, example: sv }
    ExerciseItem:
      type: object
      required: [itemId, itemType, exerciseType, lexemeId, prompt, exercise]
      properties:
        itemId: { type: string }
        itemType: { type: string, enum: [exercise] }
        exerciseType: { $ref: '#/components/schemas/ExerciseType' }
        lexemeId: { type: integer, format: int64 }
        formType:
          type: string
          nullable: true
          description: Which form is tested; null for whole-word exercises.
          example: preteritum
        prompt: { $ref: '#/components/schemas/Prompt' }
        exercise:
          description: Type-specific answer payload, discriminated by exerciseType.
          oneOf:
            - $ref: '#/components/schemas/EnEttPayload'
            - $ref: '#/components/schemas/TranslatePayload'
            - $ref: '#/components/schemas/AssemblePayload'
            - $ref: '#/components/schemas/OptionsPayload'
            - $ref: '#/components/schemas/MultiSelectPayload'

    EnEttPayload:
      type: object
      required: [options, correctAnswer]
      properties:
        options:
          type: array
          items: { type: string }
          example: [en, ett]
        correctAnswer: { type: string, example: ett }
    TranslatePayload:
      type: object
      required: [options, correctAnswer]
      properties:
        optionsLang:
          type: string
          description: Language of the options when it differs from the prompt.
          example: en
        options:
          type: array
          items: { type: string }
          example: [house, car, tree, dog]
        correctAnswer: { type: string, example: house }
    AssemblePayload:
      description: >
        `correctAnswer` is always the word's citation/base form (e.g. `gå`,
        never a non-citation form like `gick`) - the prompt is the
        LEXEME-level translation, which names the citation form, so a
        non-citation target would show a mismatched clue.
      type: object
      required: [letters, answerLength, correctAnswer]
      properties:
        letters:
          type: array
          description: Pre-shuffled, longer than the answer, may contain duplicates. Positional, not a set.
          items: { type: string }
          example: [å, x, g]
        answerLength: { type: integer, example: 2 }
        correctAnswer: { type: string, example: gå }
    OptionsPayload:
      description: >
        Single-answer choice payload (base_form, produce_form). For
        produce_form, options are sibling forms of the SAME word (e.g.
        flickan/flickor/flickorna for flicka) - every option is a
        grammatically valid word, so `prompt.text` names the target
        inflection in parentheses (e.g. "flicka (definite singular)"; see
        `formType` for the machine-readable code) rather than showing the
        bare citation form alone, which would leave more than one option
        looking correct.
      type: object
      required: [options, correctAnswer]
      properties:
        options:
          type: array
          items: { type: string }
          example: [gå, gick, stå, få]
        correctAnswer: { type: string, example: gå }
    MultiSelectPayload:
      type: object
      required: [options, correctAnswers]
      properties:
        options:
          type: array
          items: { type: string }
          example: [går, gick, gått, house, springer]
        correctAnswers:
          type: array
          items: { type: string }
          example: [går, gick, gått]

    # ---- result submission ----
    # Only exercise items produce results; introduce cards are never submitted.
    Result:
      type: object
      required: [itemId, lexemeId, exerciseType, isCorrect]
      properties:
        itemId: { type: string, description: itemId of the exercise item being answered. }
        lexemeId: { type: integer, format: int64 }
        exerciseType: { $ref: '#/components/schemas/ExerciseType' }
        formType: { type: string, nullable: true }
        isCorrect: { type: boolean }
        elapsedMs: { type: integer }
    ResultsBatch:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/Result' }
    CompleteResponse:
      type: object
      properties:
        sessionId: { type: string }
        progress:
          type: array
          items: { $ref: '#/components/schemas/WordProgress' }

    # ---- home / stats ----
    HomeResponse:
      type: object
      properties:
        # Expanded from {id, email} to the full AccountView now that GET /me
        # exists - additive; clients reading only id/email are unaffected.
        user: { $ref: '#/components/schemas/AccountView' }
        enrollments:
          type: array
          items: { $ref: '#/components/schemas/Enrollment' }
        resume:
          type: object
          nullable: true
          properties:
            listId: { type: integer, format: int64 }
    Stats:
      type: object
      properties:
        wordsKnown: { type: integer, description: Distinct lexemes mastered across all lists }
        streakDays: { type: integer }

    # ---- error ----
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [status, code, message]
          properties:
            status: { type: integer, example: 400 }
            code:
              type: string
              description: Stable machine-readable code. Clients branch on this, never on message.
              example: NO_TRANSLATION_AVAILABLE
            message: { type: string, example: No translation exists for this word in the target language }
            traceId: { type: string, example: req_a3f2c9 }